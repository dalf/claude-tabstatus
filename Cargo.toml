[package]
name = "tabstatus"
version = "0.1.0"
edition = "2021"
# Raised from 1.74 for `std::fs::File::lock`, stable since 1.89, which is what
# makes the state layer's read-modify-write atomic without a dependency. The
# alternative was a bounded compare-and-retry loop, which is more code and only
# probably correct; a lock that ships in std is neither. That is the Unix lock;
# Windows locks one byte directly (see src/sys/windows.rs), because std's lock
# there covers the whole file and refuses readers. Toolchain here: 1.98.1.
rust-version = "1.89"
description = "Puts the Claude Code session state into the terminal tab title."
license = "GPL-3.0-or-later"
publish = false

# Hook metadata is parsed structurally without constructing unused JSON values.
# No derive feature or procedural macros are needed.
[dependencies]
serde = "1"
serde_json = "1"

# Windows only: DeviceIoControl, to make the plugin link a directory junction.
# std can make only a symlink, which Windows refuses without Developer Mode or
# elevation. Storage_FileSystem for the rest of that link's mechanics and for path
# identity: a no-replace rename, the drive type, and a directory's stored spelling
# of a name - and for the state record: a file's identity from a handle, a
# one-byte lock, a POSIX-semantics replace, and the volume's rename capability.
# System_Threading for a process's creation time, which is a record origin's start
# time there. And for session-start and session-end, which title the console Claude
# Code runs in: System_Console to attach to it and set its title, and - for the
# headless guard - Wdk_System_Threading (a process's parent and its PEB) and
# System_Diagnostics_Debug (reading its standard output handle out of that PEB).
# Security, so a rewritten settings.json and its backups keep the file's own DACL:
# read from the old file and set on the new one, by handle.
# Declarations only; no Unix build sees this crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_Threading"] }

# Tests only (tests/conpty.rs): CreateProcessW takes SECURITY_ATTRIBUTES, and an
# optional ConPTY package's conpty.dll is loaded by name. Security_Authorization
# for the unit tests that set and read a DACL as SDDL, independently of the code
# they test.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_System_LibraryLoader"] }

[[bin]]
name = "tabstatus"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# Measured dependency-only speed optimization; application code stays size-first.
[profile.release.package.serde]
opt-level = 3
[profile.release.package.serde_core]
opt-level = 3
[profile.release.package.serde_json]
opt-level = 3
[profile.release.package.memchr]
opt-level = 3
