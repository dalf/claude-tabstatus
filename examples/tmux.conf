# Optional reference configuration for claude-tabstatus, tested with tmux 3.7c.
# Copy the settings you want into ~/.tmux.conf, then run:
#   tmux source-file ~/.tmux.conf
# This is a provisional theme, not a configuration installed by the plugin.
# The rounded caps require a font with the Powerline glyphs U+E0B6/U+E0B4.
# Keep status enabled and status-interval positive for the plugin's TTL decay.
#
# If the plugin previously installed local window format overrides, run these
# inside each affected window after loading this configuration:
#   tmux set-option -wu -t "$TMUX_PANE" window-status-format
#   tmux set-option -wu -t "$TMUX_PANE" window-status-current-format

set -g mouse on
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -ga terminal-overrides ',*:Tc'
set -g history-limit 100000

# Put the window list at the top, without extra left/right status text.
set -g status-position top
set -g status-justify left
set -g status-style "bg=#1f2329,fg=#c5c8c6"
set -g status-left ""
set -g status-right ""
set -g status-left-length 0
set -g status-right-length 0
set -g window-status-separator ""

# Display the active Claude pane's location (repository@branch in a Git tree).
# Other panes use the normal window name. This never renames the window.
# In split windows the label follows the active pane; the strip includes all
# Claude panes. The location is refreshed by Claude hooks, not by Git polling.
set -g @claude_window_label '#{?#{||:#{m/r: ct1 [wai] [0-9]+$,#{pane_title}},#{m/r: ct2 [pWA] [0-9]+$,#{pane_title}}},#{s| ct[12] [waipWA] [0-9]*$||:#{pane_title}},#{window_name}}'

# Inactive: charcoal. Keep the strip marker directly in both window formats so
# the plugin recognizes explicit placement and does not prepend another strip.
set -g window-status-format "#[fg=#303641,bg=#1f2329]#[fg=#b5bdc9,bg=#303641,nobold] #{T:@cctab_window_strip} #I:#{E:@claude_window_label} #[fg=#303641,bg=#1f2329] "

# Active: a dark status badge keeps blue/orange/purple/white glyphs readable, while a
# light label makes the selected window stand out from the inactive windows.
set -g window-status-current-format "#[fg=#111827,bg=#1f2329]#[fg=#f9fafb,bg=#111827,nobold] #{T:@cctab_window_strip} #[fg=#111827,bg=#e5e7eb,bold] #I:#{E:@claude_window_label} #[fg=#e5e7eb,bg=#1f2329,nobold]"
